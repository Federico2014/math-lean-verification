name: Submit a candidate result
description: Register a mathematical problem, proof sources, and formalization materials without automatically executing code.
title: "[Candidate] "
body:
  - type: markdown
    attributes:
      value: |
        Submit only materials authorized for public sharing. Registration does not establish a valid proof or an award.
        If no Lean project exists yet, you may register an issue and explicitly identify the missing materials.
  - type: input
    id: title
    attributes:
      label: Result title and first public disclosure date
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Original mathematical problem and exact scope
      description: Provide the original source, version, and statement. Specify whether this is a proof, counterexample, special case, or partial result.
    validations:
      required: true
  - type: textarea
    id: papers
    attributes:
      label: Papers and public evidence
      description: Provide public links and distinguish original results, prior work, and formal verification.
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Lean source repository
      description: Public GitHub HTTPS URL; enter "Pending" if no project exists yet.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Full commit SHA
      description: Fixed 40-character commit; enter "Pending" if no project exists yet. main/latest are not accepted verification versions.
    validations:
      required: true
  - type: textarea
    id: targets
    attributes:
      label: All target theorems and environment
      description: Files, modules, theorem names, Lean/Mathlib/dependency versions, unproved assumptions, and build limitations.
    validations:
      required: true
  - type: textarea
    id: attribution
    attributes:
      label: Attribution and proof strategy
      description: Problem solvers, formalization contributors, AI roles, prior results, and other proof projects for the same problem.
    validations:
      required: true
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Publication and verification acknowledgements
      options:
        - label: The materials may be shared publicly and contain no credentials, KYC data, payment details, or unauthorized content.
          required: true
        - label: I understand that this form and registration CI do not establish proof validity or award eligibility.
          required: true
