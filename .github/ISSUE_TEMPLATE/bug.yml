name: Infrastructure issue
description: Report a non-sensitive tool, documentation, or CI issue.
body:
  - type: markdown
    attributes:
      value: Report exploitable security vulnerabilities privately through the Security page; do not disclose exploit details publicly.
  - type: textarea
    id: description
    attributes:
      label: Problem and reproduction steps
      description: Describe expected and actual behavior and relevant versions. Remove sensitive data.
    validations:
      required: true
