name: Resume waiting Lean candidates
on:
  push:
    branches: [main, develop]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lean-candidate-resume-${{ github.ref }}
  cancel-in-progress: false
jobs:
  resume:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: >-
          python -m pip install --only-binary=:all: --require-hashes -r requirements-ci.lock
      # Static metadata only. Candidate Lean/Lake never runs in this job.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python -m verifier.resume
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: candidate-resume-${{ github.sha }}-${{ github.run_attempt }}
          path: resume-report.json
          retention-days: 30
