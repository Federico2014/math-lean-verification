name: Registry CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: registry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  registry:
    name: registry
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-ci.lock
      - name: Validate registry (no proof execution)
        run: python -m verifier validate
  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-ci.lock
      - name: Test registry and workflow boundaries
        run: python -m unittest discover -s tests -v
