name: Registry CI
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: registry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  registry:
    name: registry
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-ci.lock
      - name: Validate registry (no proof execution)
        run: python -m verifier validate
      - name: Prepare registration summary preview
        env:
          REGISTRY_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python -m verifier sync-readme --repository "$REGISTRY_REPOSITORY" --output "$RUNNER_TEMP/README.generated.md"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: registration-summary-preview
          path: ${{ runner.temp }}/README.generated.md
          retention-days: 30
  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-ci.lock
      - name: Test registry and workflow boundaries
        run: python -m unittest discover -s tests -v
