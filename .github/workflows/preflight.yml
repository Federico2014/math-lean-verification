name: Verification preflight
on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: Registered submission ID (preflight only; Lean backend is not enabled)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: verification-preflight
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-ci.lock
      - name: Prepare a non-executing plan (blocked until backend onboarding)
        env:
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: python -m verifier plan "$SUBMISSION_ID" --output plan.json
      - name: Upload preflight diagnostics (not a formal archive)
        if: ${{ always() && hashFiles('plan.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-plan
          path: plan.json
          retention-days: 14
          if-no-files-found: error
