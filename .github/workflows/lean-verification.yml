name: Trusted Lean verification
run-name: Lean PR ${{ github.event.pull_request.number || inputs.pr }} ${{ github.event.pull_request.head.sha || inputs.expected_head }} ${{ github.event.pull_request.base.sha || github.sha }} ${{ github.event.pull_request.base.ref || github.ref_name }}
on:
  pull_request_target:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: Open PR number to verify against its current protected target branch
        required: true
        type: string
      expected_head:
        description: Expected PR head for automatic resumption
        required: false
        type: string
      expected_base:
        description: Expected protected target revision
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: trusted-lean-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true
jobs:
  resolve:
    concurrency:
      group: lean-status-${{ github.event.pull_request.number || inputs.pr }}
      cancel-in-progress: false
    if: >-
      (github.event_name == 'pull_request_target' &&
       (github.event.pull_request.base.ref == 'main' || github.event.pull_request.base.ref == 'develop')) ||
      (github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    outputs:
      head: ${{ steps.resolve.outputs.head }}
      base: ${{ steps.resolve.outputs.base }}
      base_ref: ${{ steps.resolve.outputs.base_ref }}
      pr: ${{ steps.resolve.outputs.pr }}
    steps:
      # PR-target event refs point to the default branch, not necessarily the base.
      # The resolver checks this exact checkout against the live protected branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/gate_status.py resolve
  plan:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      status: ${{ steps.plan.outputs.status }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.base }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned controller dependencies
        run: >-
          python -m pip install --only-binary=:all: --require-hashes -r requirements-ci.lock
      - id: plan
        name: Resolve affected candidates using protected-base rules
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr }}
          PR_HEAD: ${{ needs.resolve.outputs.head }}
        run: python -m verifier.merge_gate --repository "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --head "$PR_HEAD" --check-only --output "$RUNNER_TEMP/precheck"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: lean-plan-${{ needs.resolve.outputs.head }}
          path: ${{ runner.temp }}/precheck
          retention-days: 30
  verify:
    needs: [resolve, plan]
    if: needs.plan.outputs.status == 'ready'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    # The matrix comes from the trusted plan. No write permissions or secrets.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.base }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned controller dependencies
        run: >-
          python -m pip install --only-binary=:all: --require-hashes -r requirements-ci.lock
      - name: Build trusted checker tools
        run: docker build -t lean-gate-tools backend
      - name: Prepare the approved reusable environment
        env:
          ENVIRONMENT_ID: ${{ matrix.environment }}
        run: python -m verifier.build_environment "$ENVIRONMENT_ID" --output "$RUNNER_TEMP/images.json"
      - name: Verify every required target and its trusted statement
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr }}
          PR_HEAD: ${{ needs.resolve.outputs.head }}
          SUBMISSION_ID: ${{ matrix.submission }}
        run: python -m verifier.merge_gate --repository "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --head "$PR_HEAD" --submission "$SUBMISSION_ID" --images "$RUNNER_TEMP/images.json" --output "$RUNNER_TEMP/proof-evidence"
      - name: Seal and read back diagnostic evidence
        if: always()
        run: python -m verifier.evidence seal "$RUNNER_TEMP/proof-evidence" --output "$RUNNER_TEMP/evidence-archive"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: lean-evidence-${{ matrix.submission }}-${{ needs.resolve.outputs.head }}
          path: |
            ${{ runner.temp }}/proof-evidence
            ${{ runner.temp }}/evidence-archive
          retention-days: 90
  publish:
    concurrency:
      group: lean-status-${{ github.event.pull_request.number || inputs.pr }}
      cancel-in-progress: false
    needs: [resolve, plan, verify]
    if: always() && needs.resolve.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.base }}
          persist-credentials: false
      # Only the trusted job result and fixed status enum are consumed, never artifacts.
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ needs.resolve.outputs.head }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr }}
          EXPECTED_BASE: ${{ needs.resolve.outputs.base }}
          EXPECTED_BASE_REF: ${{ needs.resolve.outputs.base_ref }}
          EXECUTION_RESULT: ${{ needs.verify.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          PLAN_STATUS: ${{ needs.plan.outputs.status }}
        run: python3 scripts/gate_status.py finish
