name: Lean backend tests
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'verifier/**'
      - 'scripts/backend_smoke.py'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: >-
          python -m pip install --only-binary=:all: --require-hashes -r requirements-ci.lock
      - name: Build pinned verification tools (no candidate input)
        run: docker build -t lean-gate-tools backend
      - name: Run real proof and sandbox regression cases
        run: |
          image_id=$(docker image inspect lean-gate-tools --format '{{.Id}}')
          python scripts/backend_smoke.py --image "$image_id" --output "$RUNNER_TEMP/backend-evidence"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: backend-test-evidence
          path: ${{ runner.temp }}/backend-evidence
          retention-days: 30
