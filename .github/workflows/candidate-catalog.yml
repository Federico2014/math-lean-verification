name: Publish registered candidates
on:
  push:
    branches: [main, develop]
  schedule:
    - cron: '12,27,42,57 * * * *'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: lean-candidate-catalog
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: >-
          python -m pip install --only-binary=:all: --require-hashes -r requirements-ci.lock
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python -m verifier.catalog --output "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: ${{ runner.temp }}/site
  deploy:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
